name: PocketSelfAgente
options: { bundleIdPrefix: space.voltolini, deploymentTarget: { iOS: "17.0" } }
settings:
  base: { SWIFT_VERSION: "5.9", CODE_SIGN_STYLE: Automatic }
targets:
  PocketSelfAgente:
    type: application
    platform: iOS
    sources: [Anfitriao]
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: "${PS_AGENTE_ID}", GENERATE_INFOPLIST_FILE: YES, INFOPLIST_KEY_UILaunchScreen_Generation: YES } }
  PocketSelfAgenteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Runner, Fonte]
    dependencies: [{ target: PocketSelfAgente }]
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: "${PS_AGENTE_ID}.runner", GENERATE_INFOPLIST_FILE: YES, TEST_TARGET_NAME: PocketSelfAgente,
      INFOPLIST_KEY_NSLocalNetworkUsageDescription: "O agente do PocketSelf usa o modelo local da rede." } }
schemes:
  PocketSelfAgente:
    build: { targets: { PocketSelfAgente: all, PocketSelfAgenteUITests: [test] } }
    test: { targets: [PocketSelfAgenteUITests] }
